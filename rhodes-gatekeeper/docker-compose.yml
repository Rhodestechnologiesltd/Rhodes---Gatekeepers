# Reference deployment: app + PostgreSQL. Put an HTTPS reverse proxy (Nginx, Caddy, IIS/ARR,
# Azure Front Door, etc.) in front of port 8080 — the tablet camera and secure cookies require HTTPS.
# Secrets are read from a .env file next to this compose file (create it from .env.example; do not commit it).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DB_CLIENT: pg
      DATABASE_URL: postgres://gatekeeper:${POSTGRES_PASSWORD}@db:5432/gatekeeper
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      STORAGE_DIR: /data/files      # always the persistent volume, whatever .env says
      MOBILE_DEV_ORIGINS: ""        # installed tablet apps need no extra origins in production
    volumes:
      - files:/data/files   # encrypted visit folders (ID photos, plates, PO/invoices) — back this up
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  files:
